name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --extra llm --extra web --extra dev

      - name: Ruff
        run: uv run ruff check .

      # Scoped to Classes/pipeline by pyproject; the older modules are not
      # annotated yet and are followed silently.
      - name: Mypy (strict)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra llm --extra web --extra dev

      # tests/golden/test_golden.py re-runs update_golden.py as a dry run, so a
      # drifted fixture fails here rather than silently ageing.
      - name: Pytest with coverage gate
        run: >
          uv run pytest tests/ tests/golden/ -q
          --cov=Classes
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
