[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4lineage"
version = "0.1.0"
description = "LLM-assisted SQL column-level lineage toolkit built on sqlglot."
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.2.1",
    "langchain",
    "langchain-core",
    "langchain-community",
    "typing-extensions",
    "dataclasses-json",
    "huggingface-hub",
    "langchain-huggingface",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "json5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2",
    "notebook>=7.5.2",
    "ipykernel>=6.31.0",
    "networkx>=3.2.1",
    "graphviz>=0.21",
    "matplotlib>=3.9.4",
    "langgraph>=0.6.11",
    "pandas>=2.3.3",
    "streamlit>=1.50.0",
    "pyperclip>=1.11.0",
    "watchdog>=6.0.0",
    "tqdm>=4.67.1",
    "numpy>=2.0.2",
    "langchain-gigachat>=0.3.12",
    "gigachat>=0.1.43",
    "sqlglot>=26.26.0",
    "plotly>=6.0.0",
    "ipywidgets>=8.1.0",
    "anywidget>=0.9.0",
]

[project.scripts]
sql-pipeline = "Classes.pipeline.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Classes*", "sql_pipeline*"]

[tool.setuptools.package-data]
Classes = ["pipeline/prompts/*.txt"]
