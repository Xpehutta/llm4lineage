[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4lineage"
version = "0.1.0"
description = "LLM-assisted SQL column-level lineage toolkit built on sqlglot."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.1",
    "typing-extensions",
    "dataclasses-json",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "json5",
    "networkx>=3.2.1",
    "sqlglot>=26.26.0,<27",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.50.0",
    "plotly>=6.0.0",
    "graphviz>=0.21",
    "matplotlib>=3.9.4",
    "pyperclip>=1.11.0",
    "watchdog>=6.0.0",
]
notebooks = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2",
    "notebook>=7.5.2",
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.0",
    "anywidget>=0.9.0",
    "pandas>=2.3.3",
    "numpy>=2.0.2",
]
llm = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-huggingface",
    "langchain-gigachat>=0.3.12",
    "gigachat>=0.1.43",
    "langgraph>=0.6.11",
    "huggingface-hub",
    "tqdm>=4.67.1",
]
dev = [
    "pytest",
    "ruff",
]
all = [
    "llm4lineage[web,notebooks,llm,dev]",
]

[project.scripts]
sql-pipeline = "Classes.pipeline.main:main"
llm4lineage-openlineage = "Classes.openlineage_exporter:main"
llm4lineage-impact = "Classes.impact:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Classes*", "sql_pipeline*"]

[tool.setuptools.package-data]
Classes = ["pipeline/prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"Web/*" = ["E402"]
